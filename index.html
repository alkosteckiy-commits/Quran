.tools{display:flex;gap:8px;flex-wrap:wrap;padding-block:10px 2px}

.chip.on{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);padding-block:8px 4px}

.head{text-align:center;padding-block:18px 6px}

.ay.cur{background:var(--gold-soft);border-radius:12px;box-shadow:0 0 0 8px var(--gold-soft)}

.player .info small{display:block;color:var(--muted);font-size:12px}
.pb{min-width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.pb.main{background:var(--gold);color:var(--bg)}
.pb.on{color:var(--gold)}

const MIN=20,MAX=80;
function applySize(show){size=Math.max(MIN,Math.min(MAX,Math.round(size)));document.documentElement.style.setProperty('--ar-size',size+'px');S.set('size',size);if(show){const z=$('zoom');z.textContent='Размер '+Math.round(size/34*100)+'%';z.classList.remove('hide');clearTimeout(applySize.t);applySize.t=setTimeout(()=>z.classList.add('hide'),900)}}
function applyFlags(){const b=$('body');b.classList.toggle('notr',!tr);b.classList.toggle('notj',!tj);$('trB').classList.toggle('on',tr);$('trB').textContent=tr?'Перевод: вкл':'Перевод: выкл';$('tjB').classList.toggle('on',tj)}
const norm=s=>s.toLowerCase().replace(/ё/g,'е').replace(/[-‐ʼ'’\s]/g,'');
function renderList(){
  const q=norm($('q').value||''),ul=$('suras');ul.innerHTML='';
  const f=document.createDocumentFragment();
  IDX.filter(s=>!q||String(s[0])===q||norm(s[1]).includes(q)||norm(s[4]).includes(q)||s[2].includes($('q').value.trim())).forEach(s=>{
    const li=document.createElement('li'),b=document.createElement('button');
    b.innerHTML='<span class="num">'+s[0]+'</span><span class="nm"><b></b><span></span></span><span class="sar"></span>';
    b.querySelector('b').textContent=s[1];b.querySelector('.nm span').textContent=s[4]+' · '+s[3]+' аятов';b.querySelector('.sar').textContent=s[2];
    b.onclick=()=>{location.hash='s-'+s[0]};li.appendChild(b);f.appendChild(li)});
  ul.appendChild(f);
  const p=S.get('pos',null);
  if(p&&IDX[p.s-1]){$('cont').hidden=false;$('contT').textContent='Продолжить: '+IDX[p.s-1][1];$('contS').textContent='аят '+p.a+' из '+IDX[p.s-1][3];$('cont').onclick=()=>{location.hash='s-'+p.s}}
}
async function load(n){if(cache[n])return cache[n];const r=await fetch('data/'+n+'.json');const d=await r.json();cache[n]=d;return d}
let obs=null;
async function openSura(n,ayah){
  cur=n;const s=IDX[n-1];$('list').hidden=true;$('reader').hidden=false;
  $('rt').textContent=n+'. '+s[1];const body=$('body');body.innerHTML='<div class="msg">Загрузка…</div>';
  $('prevN').textContent=n>1?'‹ '+IDX[n-2][1]:'';$('prevN').hidden=n<=1;$('prevB').disabled=n<=1;
  $('nextN').textContent=n<114?IDX[n][1]+' ›':'';$('nextN').hidden=n>=114;$('nextB').disabled=n>=114;
  let d;try{d=await load(n)}catch(e){body.innerHTML='<div class="msg">Не удалось загрузить суру. Проверьте интернет и откройте её снова.</div>';return}
  if(cur!==n)return;
  const f=document.createDocumentFragment();
  const h=document.createElement('div');h.className='head';h.innerHTML='<div class="ar"></div><div class="sub"></div>';
  h.querySelector('.ar').textContent='سورة '+s[2];h.querySelector('.sub').textContent=s[1]+' · «'+s[4]+'» · '+s[3]+' аятов';f.appendChild(h);
  if(n!==1&&n!==9){const b=document.createElement('div');b.className='bism';b.textContent='بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ';f.appendChild(b)}
  d.a.forEach((segs,i)=>{
    const el=document.createElement('div');el.className='ay';el.id='a'+(i+1);el.dataset.a=i+1;
    let html='';for(const g of segs){if(typeof g==='string')html+=esc(g);else html+='<span class="c'+g[1]+'">'+esc(g[0])+'</span>'}
    el.innerHTML='<div class="a">'+html+' <span class="no">﴿'+AN(i+1)+'﴾</span></div><button class="play" data-a="'+(i+1)+'">▶ Слушать</button><div class="tr"><em>'+(i+1)+'</em><span></span></div>';
    el.querySelector('.tr span').textContent=d.t[i]||'';f.appendChild(el)});
  body.innerHTML='';body.appendChild(f);applyFlags();
  if(n<114)load(n+1).catch(()=>{});
  const target=ayah&&ayah>1?$('a'+ayah):null;
  if(target)target.scrollIntoView({block:'start'});else window.scrollTo(0,0);
  if(obs)obs.disconnect();
  obs=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){S.set('pos',{s:n,a:+e.target.dataset.a});break}},{rootMargin:'-80px 0px -70% 0px'});
  body.querySelectorAll('.ay').forEach(x=>obs.observe(x));
  if(!ayah||ayah===1)S.set('pos',{s:n,a:1});
}
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function route(){
  const m=/^#s-(\d+)$/.exec(location.hash);
  if(m&&+m[1]>=1&&+m[1]<=114){const n=+m[1];const p=S.get('pos',null);openSura(n,p&&p.s===n?p.a:1)}
  else{$('reader').hidden=true;$('list').hidden=false;cur=0;renderList()}
}
$('q').addEventListener('input',renderList);
$('back').onclick=()=>{location.hash='list'};
const go=d=>{const n=cur+d;if(n>=1&&n<=114){const p=S.get('pos',null);S.set('pos',{s:n,a:1});location.hash='s-'+n}};
$('prevB').onclick=$('prevN').onclick=()=>go(-1);$('nextB').onclick=$('nextN').onclick=()=>go(1);
$('minus').onclick=()=>{size-=4;applySize(true)};$('plus').onclick=()=>{size+=4;applySize(true)};
$('trB').onclick=()=>{tr=!tr;S.set('tr',tr);applyFlags()};$('tjB').onclick=()=>{tj=!tj;S.set('tj',tj);applyFlags()};
$('lgB').onclick=()=>{$('legend').hidden=!$('legend').hidden;$('lgB').classList.toggle('on',!$('legend').hidden)};
$('goB').onclick=()=>{const b=$('goB');if(b.querySelector('input'))return;const max=IDX[cur-1][3];b.innerHTML='<input id="goI" type="number" min="1" max="'+max+'" placeholder="1–'+max+'" style="width:84px;font:inherit;background:transparent;border:0;color:inherit">';const i=$('goI');i.focus();
  const done=()=>{const v=+i.value;b.textContent='К аяту…';if(v>=1&&v<=max){const t=$('a'+v);if(t)t.scrollIntoView({block:'start'})}};
  i.addEventListener('keydown',e=>{if(e.key==='Enter')done()});i.addEventListener('blur',done)};
/* щипок двумя пальцами — увеличение текста, как колёсико на часах */
let pinch=null;
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
document.addEventListener('touchstart',e=>{if(e.touches.length===2&&!$('reader').hidden){pinch={d:dist(e.touches),s:size,a:topAyah()}}},{passive:true});
document.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){e.preventDefault();size=pinch.s*dist(e.touches)/pinch.d;applySize(true)}},{passive:false});
document.addEventListener('touchend',e=>{if(pinch&&e.touches.length<2){const a=pinch.a;pinch=null;if(a){const t=$('a'+a);if(t)t.scrollIntoView({block:'start'})}}});
['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
function topAyah(){const els=document.querySelectorAll('.ay');for(const el of els){if(el.getBoundingClientRect().bottom>90)return +el.dataset.a}return 0}
/* смахивание влево/вправо — соседняя сура */
let sw=null;
document.addEventListener('touchstart',e=>{if(e.touches.length===1)sw={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()};else sw=null},{passive:true});
document.addEventListener('touchend',e=>{if(!sw||$('reader').hidden)return;const t=e.changedTouches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;if(Math.abs(dx)>90&&Math.abs(dy)<40&&Date.now()-sw.t<500)go(dx<0?1:-1);sw=null});
document.addEventListener('keydown',e=>{if($('reader').hidden||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key==='+'||e.key==='=')$('plus').click();if(e.key==='-')$('minus').click()});
$('thB').onclick=()=>{theme=theme==='light'?'dark':'light';S.set('theme',theme);applyTheme()};applyTheme();
/* бегунок справа: показывает место в суре, тянется пальцем */
const rail=$('rail'),thumb=$('thumb'),bub=$('bub');let drag=false;
function maxY(){return Math.max(1,document.documentElement.scrollHeight-innerHeight)}
function upd(){const h=rail.clientHeight-thumb.offsetHeight;const f=Math.min(1,scrollY/maxY());thumb.style.top=(f*h)+'px';rail.hidden=document.documentElement.scrollHeight<innerHeight*1.5;if(drag){const r=thumb.getBoundingClientRect();bub.style.top=(r.top+r.height/2-14)+'px';bub.textContent=!$('reader').hidden?'аят '+(topAyah()||1)+' из '+IDX[cur-1][3]:Math.round(f*100)+'%'}}
function seek(e){const r=rail.getBoundingClientRect();const f=Math.max(0,Math.min(1,(e.clientY-r.top-thumb.offsetHeight/2)/(r.height-thumb.offsetHeight)));window.scrollTo(0,f*maxY());upd()}
rail.addEventListener('pointerdown',e=>{drag=true;bub.hidden=false;rail.setPointerCapture(e.pointerId);seek(e);e.preventDefault()});
rail.addEventListener('pointermove',e=>{if(drag)seek(e)});
const stop=()=>{drag=false;bub.hidden=true};rail.addEventListener('pointerup',stop);rail.addEventListener('pointercancel',stop);
addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);setInterval(upd,1000);
/* плеер: Хусари, аяты подряд, повтор для заучивания */
const au=$('au'),pre=new Audio();pre.preload='auto';
const P={s:0,a:0,bism:false,rep:S.get('rep',1),left:0};
const url=(s,a)=>'https://everyayah.com/data/Husary_64kbps/'+String(s).padStart(3,'0')+String(a).padStart(3,'0')+'.mp3';
function mark(){document.querySelectorAll('.ay.cur').forEach(x=>x.classList.remove('cur'));if(P.s===cur&&!P.bism){const el=$('a'+P.a);if(el){el.classList.add('cur');const r=el.getBoundingClientRect();if(r.top<70||r.bottom>innerHeight-90)el.scrollIntoView({block:'center',behavior:'smooth'})}}}
function info(){$('pT').textContent=(IDX[P.s-1]||[])[1]+' · '+(P.bism?'Бисмилля':'аят '+P.a+' из '+IDX[P.s-1][3]);$('pRep').textContent=P.rep===0?'∞':'×'+P.rep;$('pRep').classList.toggle('on',P.rep!==1)}
function playAt(s,a,withBism){P.s=s;P.a=a;P.left=P.rep;P.bism=!!withBism&&a===1&&s!==1&&s!==9;au.src=P.bism?url(1,1):url(s,a);au.play().catch(()=>{});$('player').hidden=false;document.body.classList.add('playing');info();mark();
  const nx=P.bism?url(s,1):(a<IDX[s-1][3]?url(s,a+1):null);if(nx)pre.src=nx;
  if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:IDX[s-1][1]+' · аят '+a,artist:'Махмуд Халиль аль-Хусари',album:'Коран'})}catch(e){}}}
au.addEventListener('ended',()=>{if(P.bism){P.bism=false;au.src=url(P.s,P.a);au.play().catch(()=>{});info();mark();return}
  if(P.rep===0||--P.left>0){au.currentTime=0;au.play().catch(()=>{});return}
  if(P.a<IDX[P.s-1][3])playAt(P.s,P.a+1);else{$('pPlay').textContent='▶';mark()}});
au.addEventListener('play',()=>{$('pPlay').textContent='⏸'});au.addEventListener('pause',()=>{$('pPlay').textContent='▶'});
au.addEventListener('error',()=>{$('pS').textContent='Нет связи — звук не загрузился'});
au.addEventListener('playing',()=>{$('pS').textContent='Махмуд Халиль аль-Хусари'});
$('pPlay').onclick=()=>{if(au.paused){if(au.ended&&P.a)playAt(P.s,P.a);else au.play().catch(()=>{})}else au.pause()};
$('pNext').onclick=()=>{if(P.a<IDX[P.s-1][3])playAt(P.s,P.a+1)};$('pPrev').onclick=()=>{if(P.a>1)playAt(P.s,P.a-1);else playAt(P.s,1)};
$('pRep').onclick=()=>{P.rep=P.rep===1?3:P.rep===3?0:1;S.set('rep',P.rep);P.left=P.rep;info()};
$('pX').onclick=()=>{au.pause();$('player').hidden=true;document.body.classList.remove('playing');P.a=0;mark()};
$('body').addEventListener('click',e=>{const b=e.target.closest('.play');if(b)playAt(cur,+b.dataset.a,true)});
if('mediaSession' in navigator){try{navigator.mediaSession.setActionHandler('nexttrack',()=>$('pNext').click());navigator.mediaSession.setActionHandler('previoustrack',()=>$('pPrev').click())}catch(e){}}
const _open=openSura;openSura=async function(n,a){await _open(n,a);mark()};
applySize(false);window.addEventListener('hashchange',route);route();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body></html>
